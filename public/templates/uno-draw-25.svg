<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="675" viewBox="0 0 900 675" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="446" height="675" fill="#fafafa"/>
  <rect x="454" y="0" width="446" height="675" fill="#fafafa"/>
  <rect x="446" y="0" width="8" height="675" fill="#171717"/>

  <!-- Left: Uno Card with choice -->
  <g transform="translate(60, 100)">
    <rect x="30" y="40" width="260" height="380" rx="24" fill="#ee0000" stroke="#171717" stroke-width="5"/>
    <ellipse cx="160" cy="230" rx="95" ry="140" fill="#ffffff" stroke="#171717" stroke-width="4" transform="rotate(-20 160 230)"/>
    <text x="160" y="210" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="20" fill="#171717" text-anchor="middle">DO SOMETHING</text>
    <text x="160" y="245" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="16" fill="#171717" text-anchor="middle">OR</text>
    <text x="160" y="280" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="22" fill="#ee0000" text-anchor="middle">DRAW 25</text>
  </g>

  <!-- Right: Guy holding massive stack of UNO cards -->
  <g transform="translate(500, 120)">
    <circle cx="170" cy="120" r="60" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <path d="M145,150 Q170,165 195,150" stroke="#171717" stroke-width="4" fill="none"/>
    <rect x="90" y="180" width="160" height="260" rx="30" fill="#0070f3"/>

    <!-- Handful of 25 cards fanned out -->
    <g transform="translate(100, 240)">
      <rect x="-40" y="-20" width="60" height="90" rx="8" fill="#ee0000" stroke="#171717" stroke-width="2" transform="rotate(-35)"/>
      <rect x="-20" y="-25" width="60" height="90" rx="8" fill="#f9cb28" stroke="#171717" stroke-width="2" transform="rotate(-20)"/>
      <rect x="0" y="-30" width="60" height="90" rx="8" fill="#0070f3" stroke="#171717" stroke-width="2" transform="rotate(-5)"/>
      <rect x="20" y="-30" width="60" height="90" rx="8" fill="#50e3c2" stroke="#171717" stroke-width="2" transform="rotate(10)"/>
      <rect x="40" y="-25" width="60" height="90" rx="8" fill="#7928ca" stroke="#171717" stroke-width="2" transform="rotate(25)"/>
      <rect x="60" y="-15" width="60" height="90" rx="8" fill="#ff0080" stroke="#171717" stroke-width="2" transform="rotate(40)"/>
      <circle cx="10" cy="20" r="22" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    </g>
  </g>
</svg>
